name: Build Electron Apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release (macOS + Windows)
    # Single job: both targets build on macOS (NSIS cross-build works), and the
    # two electron-builder publishes run sequentially so they land on ONE GitHub
    # Release. Parallel per-platform jobs race and each create their own release.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --registry=https://registry.npmjs.org/

      # electron-builder derives the release version from package.json, not the
      # git tag — keep them in sync so auto-update metadata points at the tag.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Tag builds publish artifacts + latest.yml/latest-mac.yml + blockmaps
      # straight to the GitHub Release. Manual runs build only and ship via
      # workflow artifacts below.
      - name: Build & publish macOS
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run electron:dist:mac --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Build & publish Windows
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run electron:dist:win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.yml
          if-no-files-found: warn
