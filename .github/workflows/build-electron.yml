name: Build Electron Apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release (macOS + Windows)
    # Single job: both targets build on macOS (NSIS cross-build works), and the
    # release upload runs as ONE final step. Do NOT let electron-builder publish
    # itself (--publish always): its GitHub publisher creates a duplicate release
    # per invocation instead of reliably reusing the existing one, which splits
    # assets across two same-tag releases and breaks electron-updater.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --registry=https://registry.npmjs.org/

      # electron-builder derives the release version from package.json, not the
      # git tag — keep them in sync so auto-update metadata points at the tag.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Builds only (--publish never). latest.yml/latest-mac.yml + blockmaps are
      # still generated into dist/ because the publish provider is configured.
      - name: Build macOS
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run electron:dist:mac --publish never

      - name: Build Windows
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run electron:dist:win --publish never

      # Single upload point: find-or-create the release for this tag and attach
      # every artifact atomically (overwrites same-name assets on re-runs).
      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.yml
          if-no-files-found: warn
